name: Renovate

# Renovate does not fail a build over a config it cannot read: it stops proposing updates, and nothing says so. This catches a bad
# edit of .github/renovate.json5 (the custom managers for the runner and image pins are easy to get subtly wrong) in the pull
# request that makes it.
on:
  push:
    branches: [ main ]
    paths: [ 'renovate.*', '.github/renovate.*' ]
  pull_request:
    branches: [ main ]
    paths: [ 'renovate.*', '.github/renovate.*' ]

permissions: {}

# A newer push to the same pull request makes this run stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The runner image's Node is 22, which the current Renovate refuses (its `engines` is 24 or 26), and npx then quietly installs
    # an old Renovate that is no longer the one that reads this file. Node is installed here so that the validated Renovate is the
    # current one.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - name: Validate the Renovate configuration
      run: npx --yes --package renovate -- renovate-config-validator
