name: CI

# Every check needs only a checkout: the module's tests run against a mock provider and the checks crate reads files. Nothing here
# has cloud credentials or pushes. The repository is public, so a pull request from a fork runs this workflow, and it must run on
# GitHub-hosted runners: a self-hosted runner would run a stranger's code. `pull_request` gives a fork's run a read-only token and
# no secrets; never switch it to `pull_request_target`, which runs with both and would check out untrusted code beside them.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  module:
    name: Module
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_wrapper: false
    - name: Check formatting
      run: tofu fmt -check -recursive
    - name: Initialise without a backend
      run: tofu init -backend=false
    - name: Validate
      run: tofu validate
    - name: Test
      run: tofu test

  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        components: rustfmt, clippy
        toolchain: stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Run clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Test
      run: cargo test --workspace
    # build.sh runs as root on the build VM, so a quoting or error-handling slip is a failure that shows up only on a real VM.
    # shellcheck comes with the ubuntu-24.04 runner image, which lists it among its installed packages.
    - name: Lint the build script
      run: shellcheck image/build.sh
